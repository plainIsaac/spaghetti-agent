[project]
name = "agent-repl"
version = "0.0.1"
description = "Runtime-semantics spike for Agent REPL"
requires-python = ">=3.11"

[project.scripts]
agent-repl = "agent_repl.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
