[project]
name = "spaghetti-agent"
version = "0.0.1"
description = "Durable programmable runtime for agent workflows"
requires-python = ">=3.11"
dependencies = ["openai>=1.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spaghetti-agent = "agent_repl.__main__:main"
agent-repl = "agent_repl.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_repl = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
